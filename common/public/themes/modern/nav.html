{{define "nav"}}
<nav class="navbar modern-navbar" role="navigation" aria-label="主导航" id="nav">
    <div class="container">
        <div class="navbar-brand">
            <a class="navbar-item modern-brand" href="/">
                <img class="brand-mark" src="/public/icon/favicon.png" width="32" height="32" alt="">
                <span>{{.option.WebsiteName}}</span>
            </a>
            <button type="button" class="navbar-burger" aria-label="展开导航" aria-expanded="false" aria-controls="mainNavbar" data-target="mainNavbar">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </button>
        </div>
        <div id="mainNavbar" class="navbar-menu">
            <div class="navbar-start nav-links">
                <a class="navbar-item nav-link {{if eq .pagePath "/"}}is-current{{end}}" href="/" {{if eq .pagePath "/"}}aria-current="page"{{end}}>首页</a>
                <a class="navbar-item nav-link {{if eq .pagePath "/explorer"}}is-current{{end}}" href="/explorer" {{if eq .pagePath "/explorer"}}aria-current="page"{{end}}>文件</a>
                <a class="navbar-item nav-link {{if eq .pagePath "/image"}}is-current{{end}}" href="/image" {{if eq .pagePath "/image"}}aria-current="page"{{end}}>图床</a>
            </div>
            <div class="navbar-end">
                <form class="navbar-item nav-search" action="/" method="get" role="search">
                    <label class="is-sr-only" for="searchInput">搜索文件</label>
                    <input class="input" type="search" id="searchInput" name="query" value="{{.query}}" placeholder="搜索文件…" autocomplete="off">
                </form>
                <div class="navbar-item theme-picker">
                    <label for="themeSelect">主题</label>
                    <div class="select is-small">
                        <select id="themeSelect" onchange="switchTheme(this.value)">
                            <option value="default" {{if not .themePreference}}selected{{end}}>跟随站点</option>
                            {{range .themes}}
                            <option value="{{.ID}}" {{if eq $.themePreference .ID}}selected{{end}}>{{.Name}}</option>
                            {{end}}
                        </select>
                    </div>
                </div>
                <div class="navbar-item nav-actions">
                    <button class="button is-primary" type="button" onclick="showUploadModal()">上传</button>
                    {{if not .username}}<a class="button is-light" href="/login">登录</a>{{end}}
                </div>
                {{if .username}}
                <div class="navbar-item has-dropdown is-hoverable">
                    <a class="navbar-link" href="/manage">{{.username}}</a>
                    <div class="navbar-dropdown is-right">
                        <a class="navbar-item" href="/manage">系统管理</a>
                        <hr class="navbar-divider">
                        <a class="navbar-item" href="/logout">退出登录</a>
                    </div>
                </div>
                {{end}}
            </div>
        </div>
    </div>
</nav>
{{end}}
