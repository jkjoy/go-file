<!DOCTYPE html>
<html lang="zh-CN">
{{template "header" .}}
<body>
<main class="textcopy-shell">
    <header class="textcopy-head">
        <div>
            <h1>文本内容</h1>
            <p>查看文件内容，一键复制到剪贴板。</p>
        </div>
        <button class="btn btn-grad" type="button" id="copyBtn"
                onclick="copyText(document.getElementById('myTextarea').value); this.textContent = '已复制'">复制内容</button>
    </header>
    <label class="is-sr-only" for="myTextarea">文件内容</label>
    <textarea class="textarea textcopy-area" id="myTextarea" placeholder="文件内容为空" readonly>{{.content}}</textarea>
</main>
</body>
</html>
